<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - 签到系统</title>
    <link rel="stylesheet" href="/common/style.css">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <div class="navbar-title">历史签到记录</div>
            <div class="navbar-actions">
                <button class="btn btn-secondary" onclick="navigateTo('/teacher/courses.html')">返回课程</button>
            </div>
        </div>

        <div class="card">
            <div class="form-group">
                <label for="courseSelect">选择课程</label>
                <select id="courseSelect" onchange="loadHistory()">
                    <option value="">全部课程</option>
                </select>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label for="dateFrom">开始日期</label>
                    <input type="date" id="dateFrom" onchange="loadHistory()">
                </div>
                <div class="form-group">
                    <label for="dateTo">结束日期</label>
                    <input type="date" id="dateTo" onchange="loadHistory()">
                </div>
            </div>
        </div>

        <div id="historyList">
            <div class="loading">加载中...</div>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>

    <script src="/common/utils.js"></script>
    <script>
        let currentPage = 0;
        const pageSize = 10;

        async function loadCourses() {
            try {
                const courses = await get('/api/teacher/courses');
                const courseSelect = document.getElementById('courseSelect');
                courseSelect.innerHTML = '<option value="">全部课程</option>' +
                    courses.map(course => `<option value="${course.id}">${escapeHtml(course.courseName)}</option>`).join('');
            } catch (error) {
                showError(error.message);
            }
        }

        async function loadHistory(page = 0) {
            try {
                const courseId = document.getElementById('courseSelect').value;
                const dateFrom = document.getElementById('dateFrom').value;
                const dateTo = document.getElementById('dateTo').value;

                let url = `/api/teacher/sessions/history?page=${page}&size=${pageSize}`;
                if (courseId) url += `&courseId=${courseId}`;
                if (dateFrom) url += `&dateFrom=${dateFrom}`;
                if (dateTo) url += `&dateTo=${dateTo}`;

                const data = await get(url);
                const historyList = document.getElementById('historyList');

                if (data.content.length === 0) {
                    historyList.innerHTML = '<div class="empty">暂无历史记录</div>';
                    document.getElementById('pagination').innerHTML = '';
                    return;
                }

                historyList.innerHTML = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th>课程ID</th>
                                <th>开始时间</th>
                                <th>结束时间</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.content.map(session => `
                                <tr>
                                    <td>${session.courseId}</td>
                                    <td>${formatDateTime(session.startTime)}</td>
                                    <td>${session.endTime ? formatDateTime(session.endTime) : '-'}</td>
                                    <td>${session.status === 'OPEN' ? '进行中' : '已结束'}</td>
                                    <td>
                                        <button class="btn btn-primary" onclick="viewDetails(${session.id})">查看详情</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                // 分页
                const pagination = document.getElementById('pagination');
                pagination.innerHTML = `
                    <button class="btn btn-secondary" ${page === 0 ? 'disabled' : ''} onclick="loadHistory(${page - 1})">上一页</button>
                    <span>第 ${page + 1} / ${data.totalPages} 页</span>
                    <button class="btn btn-secondary" ${page >= data.totalPages - 1 ? 'disabled' : ''} onclick="loadHistory(${page + 1})">下一页</button>
                `;

                currentPage = page;
            } catch (error) {
                if (error.message.includes('未登录')) {
                    navigateTo('/teacher/login.html');
                } else {
                    showError(error.message);
                }
            }
        }

        function viewDetails(sessionId) {
            navigateTo(`/teacher/realtime.html?sessionId=${sessionId}`);
        }

        loadCourses();
        loadHistory();
    </script>
</body>
</html>
